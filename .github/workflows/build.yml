# Собирает мод на каждый push и pull request, а при теге вида v1.0.0
# выкладывает jar в GitHub Releases.

name: build
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write   # нужно только для публикации релиза по тегу

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'        # JDK для сборки (как в шаблоне); мод компилируется под Java 21
          distribution: 'microsoft'
      - name: setup gradle (cache)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: remake-arsenal
          path: build/libs/
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
          fail_on_unmatched_files: true
